name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jumbobox_test
        ports:
          - 54330:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jumbobox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54330/jumbobox_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54330/jumbobox_test
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: ci-only-admin-password
      AUTH_SECRET: ci-only-jombubox-secret-at-least-32-characters
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      APP_ENV: preview
      ENABLE_IMPORTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm cf:build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
